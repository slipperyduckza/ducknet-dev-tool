map $arg_v $asset_immutable {
    "" "";
    default ", immutable";
}

# HTTP - ACME challenges via Let's Encrypt certbot, redirect to HTTPS
server {
    if ($host = dev2.ducknet.co.za ) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 192.168.0.205:80;
    server_name dev2.ducknet.co.za;
    return 404; # managed by Certbot

        location ~ /\.well-known/acme-challenge/ {
        allow all;
        root /var/www/letsencrypt;
        try_files $uri =404;
        break;
        }
}


# dev2.ducknet.co.za - HTTPS (SSL terminated here, proxy_protocol from edge)
server {
    listen 192.168.0.205:443 ssl proxy_protocol;
    server_name dev2.ducknet.co.za;
    server_tokens off;
    http2 on;

    set_real_ip_from 192.168.0.10;
    real_ip_header proxy_protocol;

    ssl_certificate /etc/letsencrypt/live/dev2.ducknet.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev2.ducknet.co.za/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/dhparams.pem;

    root /home/rxadmin/Documents/CODING/nextcloud/nextcloud;
    index index.php index.html /index.php$request_uri;

    include mime.types;

    access_log /var/log/nginx/nextcloud_access.log proxy_protocol_log;
    error_log /var/log/nginx/nextcloud_error.log;

    client_max_body_size 10G;
    client_body_timeout 300s;
    client_body_buffer_size 512k;
    fastcgi_buffers 64 4K;

    gzip on;
    gzip_vary on;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_proxied expired no-cache no-store private no_last_modified no_etag auth;
    gzip_types application/atom+xml text/javascript application/javascript application/json application/ld+json application/manifest+json application/rss+xml application/vnd.geo+json application/vnd.ms-fontobject application/wasm application/x-font-ttf application/x-web-app-manifest+json application/xhtml+xml application/xml font/opentype image/bmp image/svg+xml image/x-icon text/cache-manifest text/css text/plain text/vcard text/vnd.rim.location.xloc text/vtt text/x-component text/x-cross-domain-policy;

    add_header Referrer-Policy                   "no-referrer"       always;
    #add_header X-Content-Type-Options            "nosniff"           always;
    add_header X-Frame-Options                   "SAMEORIGIN"        always;
    add_header X-Permitted-Cross-Domain-Policies "none"              always;
    add_header X-Robots-Tag                      "noindex, nofollow" always;
    add_header X-XSS-Protection                  "1; mode=block"     always;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    fastcgi_hide_header X-Powered-By;

    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

location ^~ /roundcube/ {
    root /home/rxadmin/Documents/CODING/roundcube/roundcubemail/public_html;
    try_files $uri /roundcube/index.php?$query_string;
    location ~ \.php {
        if ($uri ~ ^/roundcube/(.+\.php)(/.+)?$) {
            set $rc_script $1;
            set $rc_path_info $2;
        }

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /home/rxadmin/Documents/CODING/roundcube/roundcubemail/public_html/$rc_script;
        fastcgi_param PATH_INFO $rc_path_info;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }
}

location /push/ {
    proxy_pass http://127.0.0.1:7867/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location /signaling/ {
    proxy_pass http://127.0.0.1:8080/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
}

    location ^~ /.well-known {
        location = /.well-known/carddav { return 301 /remote.php/dav/; }
        location = /.well-known/caldav  { return 301 /remote.php/dav/; }
        location /.well-known/acme-challenge {
                allow all;
                root /var/www/letsencrypt;
                access_log /var/log/nginx/webroot.access.log;
                error_log /var/log/nginx/webroot.error.log;
                try_files $uri =404;
        }
        location /.well-known/pki-validation { try_files $uri $uri/ =404; }
        return 301 /index.php$request_uri;
    }

    location ~ ^/(?:build|tests|config|lib|3rdparty|templates|data)(?:$|/)  { return 404; }
    location ~ ^/(?:\.|autotest|occ|issue|indie|db_|console)                { return 404; }

    location ~ \.php(?:$|/) {
        rewrite ^/(?!index|remote|public|cron|core\/ajax\/update|status|ocs\/v[12]|updater\/.+|ocs-provider\/.+|.+\/richdocumentscode(_arm64)?\/proxy) /index.php$request_uri;

        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        set $path_info $fastcgi_path_info;
        try_files $fastcgi_script_name =404;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $path_info;
        fastcgi_param HTTPS on;
        fastcgi_param modHeadersAvailable true;
        fastcgi_param front_controller_active true;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;

        fastcgi_intercept_errors on;
        fastcgi_request_buffering on;
        fastcgi_max_temp_file_size 0;
    }

    location ~ \.(?:css|js|mjs|svg|gif|ico|jpg|png|webp|wasm|tflite|map|ogg|flac|mp4|webm)$ {
        try_files $uri /index.php$request_uri;
        add_header Cache-Control "public, max-age=15778463$asset_immutable";
        access_log off;
    }

    location ~ \.(otf|woff2?)$ {
        try_files $uri /index.php$request_uri;
        expires 7d;
        access_log off;
    }

    location /remote {
        return 301 /remote.php$request_uri;
    }

    location / {
        try_files $uri $uri/ /index.php$request_uri;
    }

    # ADDING ROUNDCUBE

}
